services:
  - type: web
    runtime: static
    name: mitpad-web
    domains:
      - mitpad.com
    rootDir: mitpad
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm run build
    staticPublishPath: build
    autoDeployTrigger: checksPass
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: PUBLIC_CONVEX_URL
        sync: false

  - type: web
    runtime: node
    name: mitpad
    rootDir: mitpad
    buildCommand: corepack pnpm install --frozen-lockfile
    startCommand: corepack pnpm run mcp:http
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: MITPAD_CONVEX_SITE_URL
        value: https://brave-walrus-170.convex.site
