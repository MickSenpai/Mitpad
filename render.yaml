services:
  - type: web
    runtime: static
    name: mitpad-web
    domains:
      - mitpad.com
    rootDir: mitpad
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm run build
    staticPublishPath: build
    autoDeployTrigger: checksPass
    envVars:
      - key: PUBLIC_CONVEX_URL
        sync: false
