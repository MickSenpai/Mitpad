name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mitpad
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: mitpad/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Comprobar tipos y Svelte
        run: pnpm check

      - name: Compilar
        run: pnpm build

      - name: Comprobar el backend de Convex
        run: pnpm exec tsc --noEmit -p convex/tsconfig.json

  rust:
    name: Rust (Tauri)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mitpad/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema para Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mitpad/src-tauri

      - name: Formato
        run: cargo fmt --check

      - name: Linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test
