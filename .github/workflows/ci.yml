name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-latest
    env:
      PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
    defaults:
      run:
        working-directory: mitpad
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mitpad/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Comprobar tipos y Svelte
        run: pnpm check

      - name: Tests del backend
        run: pnpm test

      - name: Compilar
        run: pnpm build

      - name: Comprobar el backend de Convex
        run: pnpm exec tsc --noEmit -p convex/tsconfig.json
