name: Keep MCP awake

# Render duerme el servicio tras un rato sin tráfico; este ping evita el cold start.
# GitHub puede retrasar los crons unos minutos en horas de carga, es normal.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        run: |
          curl --fail --silent --show-error \
            --max-time 60 --retry 2 --retry-delay 10 --retry-all-errors \
            https://mitpad.onrender.com/healthz
